name: Production Smoke

# Read-only checks against the REAL deployed site — never the full test
# suite's destructive paths (ci.yml's `test`/`e2e` jobs already cover those
# against disposable, ephemeral databases on every push). This workflow makes
# real HTTPS requests to `vars.PROD_SITE_URL` (the same repository variable
# `sweep-cron.yml` already uses for the real deployment) and asserts nothing
# it could not safely assert against a stranger's production site: no
# checkout, no sign-in attempt, no write of any kind. See the comment at the
# top of tests/smoke/production.test.ts for the hard rule behind that.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PROD_SITE_URL: ${{ vars.PROD_SITE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Production smoke (read-only)
        run: npm run test:smoke

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-production-smoke
          path: allure-report/
          retention-days: 30

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  publish:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

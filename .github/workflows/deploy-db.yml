name: Deploy DB

# Manual only — on: workflow_dispatch, never on push. Re-running migrations
# automatically on every commit to production is not something anyone wants
# happening silently. Trigger this by hand from the Actions tab whenever a
# new migration needs to reach the production database.
#
# Chains:
#   1. prisma migrate deploy         — the real Prisma migrations
#   2. prisma/migrations/manual_constraints.sql — CHECK constraints and the
#      atomic book_pickup_window()/reserve_stock()/stock-adjust functions
#      Prisma cannot express. Nothing on a standard hosting-platform build
#      runs this file automatically; it must be applied out of band, and it
#      is idempotent so re-running it here on every future migration is safe.
#
# Deliberately does NOT run `prisma db seed` (the previous version of this
# workflow did). `prisma/seed.ts` no longer touches pickup windows at all —
# they're a fixed in-code template now (lib/pickup-windows.ts), never
# database rows — so there is nothing left that needs re-seeding as part of
# "apply pending schema changes." If products/settings ever need a fresh
# seed in production, that's a separate, deliberate action
# (`npx prisma db seed` run by hand against prod), not bundled into this.
on: workflow_dispatch

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:constraints
